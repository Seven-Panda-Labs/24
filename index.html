<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1D6B4F" media="(prefers-color-scheme: light)" data-scheme="light" />
    <meta name="theme-color" content="#1E2A44" media="(prefers-color-scheme: dark)" data-scheme="dark" />
    <meta name="color-scheme" content="light dark" />
    <!-- The theme chosen in Settings, before first paint. src/theme.ts does the rest. -->
    <script>
      const theme = localStorage.getItem('24:theme')
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
    </script>
    <meta name="description" content="O caos organizado de Dezembro" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="image" href="/logo.webp" type="image/webp" />
    <!-- Not render-blocking: text shows in the fallback font and swaps when the webfonts arrive. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <title>24</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
